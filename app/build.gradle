apply plugin: 'com.android.application'

// 依赖锁定（2026-11-05 整改，门禁 R1「构建可复现」）：全部 configuration 参与锁定，
// 解析结果固化到 app/gradle.lockfile 与根 settings-gradle.lockfile（与版本目录单一
// 事实源互补：toml 钉直接依赖，lockfile 钉全量传递依赖）。
// 首次生成/依赖变更后升级锁文件：./gradlew :app:dependencies --write-locks
dependencyLocking {
    lockAllConfigurations()
}

// release 构建身份（2026-11-05 整改，门禁 R10/移动端 P1）：不再复用 debug 签名。
// 本仓为侧载/源码分发、keystore 绝不入库（agent-contract 硬约束）；正式签名参数从
// 仓库根 keystore.properties（gitignored，键：storeFile/storePassword/keyAlias/keyPassword，
// storeFile 相对仓库根）或同名 GAME_SHELL_RELEASE_* 环境变量读取。两者都缺省时
// release 构建产出**未签名** APK——宁可签名缺位可见，不可静默落回 debug 身份。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystorePropsFile.exists() || System.getenv('GAME_SHELL_RELEASE_STORE_FILE') != null

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winlator'
        // 评估报告 #7：对齐 README「Android 11+/API 30」声明（原 26 与实际测试基线不符）。
        // Android 11 是 MANAGE_EXTERNAL_STORAGE / Scoped Storage 的起点，
        // 也是 README 系统要求里写明的最低版本。
        minSdkVersion 30
        // v2.9 评估整改（移动端报告 P1-2）：targetSdk 28 → 30（路线图 P9 落地）。
        // 前置核对（README.internal §7 P9）：B 路由 FileProvider 化、MANAGE_EXTERNAL_STORAGE
        // 运行时申请链（GalgameStoragePermission）均已完成；targetSdk 30 不触发
        // 前台服务类型（34+）/ POST_NOTIFICATIONS 运行时权限（33+）等更高适配项。
        // 真机回归 R1–R17（TD-02）已于 2026-10-24 永久跳过：本机只有 Adreno 设备，Mali 档
        // 永不可能执行，该条不再是发版门禁（权威口径见 docs/tech-debt-register.md TD-02）。
        targetSdkVersion 30
        versionCode 36
        versionName "11.5"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            // 正式 release 签名：参数只来自 keystore.properties / 环境变量（私钥不入库）。
            // debug 沿用 AGP 隐式 debug 签名（~/.android/debug.keystore），不在此声明。
            release {
                storeFile file(keystoreProps.getProperty('storeFile', System.getenv('GAME_SHELL_RELEASE_STORE_FILE')))
                storePassword keystoreProps.getProperty('storePassword', System.getenv('GAME_SHELL_RELEASE_STORE_PASSWORD'))
                keyAlias keystoreProps.getProperty('keyAlias', System.getenv('GAME_SHELL_RELEASE_KEY_ALIAS'))
                keyPassword keystoreProps.getProperty('keyPassword', System.getenv('GAME_SHELL_RELEASE_KEY_PASSWORD'))
            }
        }
    }

    buildTypes {
        debug {
            // 评估报告 #12：debug 关闭 minify——proguard-rules.pro 已 -dontobfuscate，
            // debug 开 minify 既拖慢构建又裁剪调试堆栈，无收益。
            minifyEnabled false

            ndk {
                // 默认 arm64-v8a（发布基线，勿改）。
                // UI 调试构建：-PgalgameUiAbi=x86_64 → x86_64 模拟器专用（arm64 预编译库被过滤，
                // cmake 另编 x86_64 原生库）。用途：模拟器无法安装 arm64-only APK
                // （INSTALL_FAILED_NO_MATCHING_ABIS），该模式仅供 UI 层（游戏库/主题/布局）调试，
                // 游戏运行时（wine/box64 rootfs）不可用。不传该属性时构建产物与原先完全一致。
                abiFilters (project.findProperty('galgameUiAbi') ?: 'arm64-v8a')
            }
        }

        // 第二轮移动端评估 T4：release 显式化（此前仅定义 debug，release 隐式存在且未声明）。
        // - minifyEnabled false：与 debug 对齐（proguard-rules.pro 现存 -dontobfuscate）；
        // 2026-11-05 整改：release **不再复用 debug 签名**（原 signingConfig signingConfigs.debug
        // 已移除）。配置了 keystore.properties / GAME_SHELL_RELEASE_* 时用正式签名；否则
        // 产出未签名 APK（assembleDebug 的 debug 签名路径不受影响，开发期安装照旧）。
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // 本仓发布基线为 arm64-v8a（README 系统要求）；不锁定时会尝试 armeabi-v7a，
            // 而 libadrenotools 不支持该 ABI，release 构建会直接失败。
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    // GameShell: aapt2 默认 ignore 模式含 <dir>_*，会从 assets 剔除下划线开头的
    // 目录——CPython 标准库的 zipfile/_path/ 因此进不了 APK（文件名以 _ 开头不受影响）。
    // 此处照抄默认项、仅去掉 <dir>_*。
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    ndkVersion '24.0.8215888'

    // UI 调试构建（-PgalgameUiAbi=x86_64）跳过原生编译：模拟器仅用于 UI 层调试，
    // 无需任何 .so；默认构建（不传该属性）保持 externalNativeBuild 原样。
    if (!project.hasProperty('galgameUiAbi')) {
        externalNativeBuild {
            cmake {
                version '3.22.1'
                path 'src/main/cpp/CMakeLists.txt'
            }
        }
    }
}

dependencies {
    // 第二轮移动端评估 T5：依赖版本集中管理（gradle/libs.versions.toml 单一事实源）
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference
    implementation libs.material
    // 版本目录不支持 artifactType；zstd-jni 的 AAR 才带 Android JNI 库，必须显式选 AAR。
    implementation(libs.zstd.jni) { artifact { type = "aar" } }
    implementation libs.xz
    implementation libs.commons.compress
    implementation libs.androidx.lifecycle.process
}
