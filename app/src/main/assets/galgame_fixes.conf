# GameShell 每游戏修复/覆盖数据层（P0-3）
#
# 由 GalgameFixRegistry 解析，ImportFlow.applyGameFixes 在 stage 阶段落地：
#   - 只改「set.* 声明过的键」，其余配置原样保留；
#   - 写入前把旧值存进容器 extraData（galgame_fixes_prev），revertGameFixes 可回滚；
#   - 导入结果写进 galgame_overlay.json（fixes_applied），诊断页可看到「改了什么」。
#
# 语法（每段一个修复）：
# [fix-id]
# enabled=true|false        # 必须显式 true 才会生效
# engines=KIRIKIRI,SIGLUS   # 空 = 任意引擎（大小写不敏感）
# exe_regex=...             # 空 = 任意 exe；Java 正则，忽略大小写
# wine_version_contains=... # 空 = 任意 Wine；如 "10." 只匹配 Wine 10.x
# set.dxwrapper=wined3d
# set.dxwrapper_config=...
# set.wincomponents=vcrun2010=1,vcrun2015=1
# set.env=FOO=1
# set.windows_version=win7
# set.screen_size=1920x1080
# set.box64_preset=compatibility
# note=一句话说明依据
#
# 白名单字段：dxwrapper / dxwrapper_config / wincomponents / env /
#            windows_version / screen_size / box64_preset
# 白名单外的 set.* 会被忽略（防止随手写出容器不认识的键）。
#
# 纪律：本批不启用任何「没有真机 A/B 证据」的修复。下面两条 enabled=false，
# 仅作 schema 示例；新增个案时复制一段、改 id/条件、置 enabled=true 即可，不需要动 Java。

[sample_kirikiri_dxvk]
enabled=false
engines=KIRIKIRI
exe_regex=
wine_version_contains=
set.dxwrapper=dxvk
note=示例：KiriKiri 走 DXVK（engine_presets.json 已是该值，仅演示字段写法）

[sample_siglus_vcrun]
enabled=false
engines=SIGLUS
exe_regex=SiglusEngine\.exe
wine_version_contains=
set.wincomponents=vcrun2010=1
set.env=LANG=ja_JP.UTF-8
note=示例：Siglus 补 VC++ 2010 并确保日文 LANG（预设已含，仅演示字段写法）
