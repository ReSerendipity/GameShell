# GameShell galgame box64 rc 段模板（P0-1）
#
# 用途：由 GalgameBox64Rc 在「已拷贝上游 default.box64rc」之后追加一段
#   [<本次启动 exe 文件名>]
#   KEY=VALUE
# 关键约束：只在启动时追加，绝不替换 default.box64rc —— 上游对 steam.exe / steamwebhelper.exe /
# farcry3.exe 等的既有修复必须原样保留。
#
# 语法：每个 [引擎] 段内的 KEY=VALUE 会写进该游戏 exe 的段；空段 = 该引擎暂不追加。
# 只允许 BOX64_ 前缀的键（解析器会丢弃其它键，防止误写 WINEDLLOVERRIDES 等进程级变量）。
# 引擎名与 overlay.galgame_overlay.json 的 engine 字段一致（大写）。
#
# 当前只启用 KIRIKIRI：TD-16 实测主窗口映射后 8-40 s 静止，先以 strongmem 稳定内存序，
# 其余引擎等真机 A/B 有结论后再逐行启用（改文本即可，不需要动 Java）。
[kirikiri]
BOX64_DYNAREC_STRONGMEM=1

[siglus]

[yrg]

[artemis]

[cat_system2]

[advhd]

[systemnnn]

[bgi]

[cmvs]

[unity]
